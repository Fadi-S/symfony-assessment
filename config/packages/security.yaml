security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users_in_memory:
            memory:
                users:
                    admin:
                        password: '$2a$12$dKJLivMut7ui5dw9tDihyOW7DOv1C8SYrUzXEo6tVZE7xxW6SgqVW'
                        roles: ['ROLE_ADMIN']
    firewalls:
        login:
            pattern: ^/api/v1/auth
            stateless: true
            json_login:
                check_path: /api/v1/auth/login
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: users_in_memory
            jwt: ~

    access_control:
        - { path: ^/api/v1/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/countries, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/v1/countries, roles: IS_AUTHENTICATED_FULLY, methods: [POST, PUT, DELETE] }

when@test:
    security:
        password_hashers:
  